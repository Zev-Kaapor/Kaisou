# Project-wide Gradle settings, which the settings configured through the IDE override

# JVM arguments of the Gradle daemon, useful to tune the memory
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel mode of Gradle, off by default and only for decoupled projects, turned on with org.gradle.parallel=true

# Configuration cache, which lets Gradle skip the configuration phase when nothing that affects it changed
org.gradle.configuration-cache=true

# Kotlin code style of this project, official or obsolete
kotlin.code.style=official
